; ESP8266 build of the doorbell transmitter. Same UI, JSON, and ESP-NOW
; wire format as doorbell_tx/ (ESP-IDF / classic ESP32).
[platformio]
default_envs = esp8266

[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
    -I ${PROJECT_DIR}/../components/lumos_doorbell/include
    -I ${PROJECT_DIR}/../components/lumos_core/include
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
upload_speed = 57600
